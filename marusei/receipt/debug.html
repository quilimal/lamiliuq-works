<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>署名検証デバッグ</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    pre  { background: #fff; padding: 12px; border-radius: 8px; overflow-x: auto;
           font-size: 12px; word-break: break-all; white-space: pre-wrap; }
    h3   { margin-top: 20px; }
    .ok  { color: green; } .ng { color: red; }
  </style>
</head>
<body>
<h2>マルセイミニレジ 署名検証デバッグ</h2>
<p>URLの # 以降にQRのBase64urlを貼り付けてアクセスしてください。</p>
<div id="out"></div>
<script>
(function(){
  function b64decode(s){
    s=s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const b=atob(s),u=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    return new TextDecoder('utf-8').decode(u);
  }
  function b64toAb(s){
    s=s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const b=atob(s),u=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    return u.buffer;
  }

  async function main(){
    const hash=location.hash.slice(1);
    if(!hash){ document.getElementById('out').innerHTML='<p>URLに#以降がありません</p>'; return; }

    let outer;
    try{ outer=JSON.parse(b64decode(hash)); }
    catch(e){ document.getElementById('out').innerHTML='<p>パースエラー: '+e.message+'</p>'; return; }

    // 新フォーマット {p, s, k} か旧フォーマットかを判定
    const isNewFormat = outer.p && outer.s && outer.k;

    let d, verifyResult='署名なし', ok=null;

    if(isNewFormat){
      // p = payload(Base64url), s = sig, k = pubkey
      d = JSON.parse(b64decode(outer.p));

      // 署名対象 = outer.p の UTF-8バイト列
      const msgBytes = new TextEncoder().encode(outer.p);

      try{
        const pubKey = await crypto.subtle.importKey(
          'raw', b64toAb(outer.k), {name:'Ed25519'}, false, ['verify']
        );
        ok = await crypto.subtle.verify('Ed25519', pubKey, b64toAb(outer.s), msgBytes);
        verifyResult = ok ? '✅ 検証成功' : '❌ 検証失敗';
      }catch(e){
        verifyResult = '❌ エラー: '+e.message;
      }

      document.getElementById('out').innerHTML =
        '<h3>フォーマット</h3><pre>新フォーマット {p, s, k}</pre>'+
        '<h3>payload (p)</h3><pre>'+outer.p+'</pre>'+
        '<h3>デコードされたJSON</h3><pre>'+JSON.stringify(d,null,2)+'</pre>'+
        '<h3>pub (k)</h3><pre>'+outer.k+'</pre>'+
        '<h3>sig (s)</h3><pre>'+outer.s+'</pre>'+
        '<h3>検証結果</h3><pre class="'+(ok===true?'ok':'ng')+'">'+verifyResult+'</pre>'+
        '<h3>msgBytes先頭50バイト</h3><pre>'+
          Array.from(new TextEncoder().encode(outer.p).slice(0,50))
            .map(function(b){return b.toString(16).padStart(2,'0');}).join(' ')+
        '</pre>';
    } else {
      // 旧フォーマット（移行期間）
      document.getElementById('out').innerHTML =
        '<h3>フォーマット</h3><pre>旧フォーマット（署名なし）</pre>'+
        '<h3>JSON</h3><pre>'+JSON.stringify(outer,null,2)+'</pre>';
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',main);
  } else { main(); }
})();
</script>
</body>
</html>
