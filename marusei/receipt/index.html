<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>マルセイミニレジ 電子レシート</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --main-blue:   #1a6fba;
      --text-black:  #111111;
      --text-gray:   #666666;
      --text-light:  #999999;
      --border:      #dddddd;
      --bg:          #f5f5f5;
      --card-bg:     #ffffff;
      --warning-bg:  #fff8e1;
      --warning-fg:  #b45309;
      --error-bg:    #fff0f0;
      --error-fg:    #cc0000;
      --font-mono:   'Noto Sans Mono', 'Courier New', 'Osaka-Mono', monospace;
      --receipt-w:   360px;
    }

    body {
      font-family: var(--font-mono);
      background:  var(--bg);
      color:       var(--text-black);
      min-height:  100vh;
      display:     flex;
      flex-direction: column;
      align-items: center;
      padding:     24px 16px 48px;
    }

    /* ── Header ── */
    .site-header {
      width: 100%;
      max-width: var(--receipt-w);
      text-align: center;
      margin-bottom: 20px;
    }
    .site-header .logo {
      font-size: 12px;
      color: var(--text-light);
      letter-spacing: 0.05em;
    }

    /* ── Receipt Card ── */
    .receipt-card {
      width: 100%;
      max-width: var(--receipt-w);
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* ── Sections ── */
    .section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child { border-bottom: none; }

    /* ── Shop Header ── */
    .shop-name {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }
    .shop-invoice {
      font-size: 11px;
      color: var(--text-gray);
      text-align: center;
      margin-bottom: 2px;
    }
    .receipt-meta {
      font-size: 12px;
      color: var(--text-gray);
      text-align: center;
    }
    .receipt-no {
      font-size: 11px;
      color: var(--text-light);
      text-align: center;
      margin-top: 2px;
    }

    /* ── Line Items ── */
    .items-table {
      width: 100%;
      border-collapse: collapse;
    }
    .items-table td {
      padding: 4px 0;
      font-size: 14px;
      vertical-align: top;
    }
    .item-name  { width: 60%; text-align: left;  color: var(--text-black); }
    .item-qty   { width: 10%; text-align: center; color: var(--text-gray); font-size: 12px; }
    .item-price { width: 30%; text-align: right;  color: var(--text-black); }
    .item-price.minus { color: #cc6600; }

    /* 小計・合計行 */
    .subtotal-row td { color: var(--text-gray); font-size: 12px; padding: 2px 0; }
    .total-row td {
      font-size: 17px;
      font-weight: 700;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .total-label { text-align: left; }
    .total-amount { text-align: right; }

    /* 税区分内訳 */
    .tax-row td { font-size: 11px; color: var(--text-gray); padding: 2px 0; }

    /* ── 領収書ゾーン ── */
    .ryoshucho {
      text-align: center;
    }
    .ryoshucho-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3em;
      margin-bottom: 10px;
    }
    .ryoshucho-atena {
      font-size: 15px;
      margin-bottom: 6px;
    }
    .ryoshucho-total {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .ryoshucho-tadashi {
      font-size: 13px;
      color: var(--text-gray);
    }

    /* ── 注意文 ── */
    .notice {
      font-size: 11px;
      color: var(--warning-fg);
      background: var(--warning-bg);
      padding: 10px 14px;
      border-radius: 6px;
      line-height: 1.6;
      margin-top: 4px;
    }
    .notice-icon { margin-right: 4px; }

    /* 明細なし警告 */
    .overflow-notice {
      font-size: 11px;
      color: var(--warning-fg);
      background: var(--warning-bg);
      padding: 8px 12px;
      border-radius: 6px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    /* ── エラー ── */
    .error-card {
      width: 100%;
      max-width: var(--receipt-w);
      background: var(--error-bg);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
    }
    .error-card h2 { font-size: 16px; color: var(--error-fg); margin-bottom: 8px; }
    .error-card p  { font-size: 13px; color: var(--text-gray); line-height: 1.6; }

    /* ── Footer ── */
    .site-footer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-light);
      text-align: center;
      line-height: 1.8;
    }
    .site-footer a { color: var(--main-blue); text-decoration: none; }

    /* ── Loading ── */
    #loading {
      font-size: 14px;
      color: var(--text-gray);
      padding: 40px;
    }

    /* スマホ最適化 */
    @media (max-width: 400px) {
      .shop-name  { font-size: 16px; }
      .total-row td { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo">マルセイミニレジ / lamiliuq works</div>
  </header>

  <main id="main">
    <div id="loading">読み込み中...</div>
  </main>

  <footer class="site-footer">
    <a href="https://www.lamiliuq.com/marusei/" target="_blank">マルセイシリーズ</a>
    &nbsp;|&nbsp; lamiliuq works
  </footer>

  <script>
  (function() {
    'use strict';

    // ── Base64url デコード ──
    function base64urlDecode(str) {
      // パディング復元
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4 !== 0) str += '=';
      const bin = atob(str);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    // ── 金額フォーマット（カンマ区切り） ──
    function formatAmount(n) {
      return '¥\u00a0' + Math.abs(n).toLocaleString('ja-JP');
    }

    // ── 日時フォーマット ──
    function formatDate(dateStr) {
      // "2026-06-06" → "2026年6月6日"
      const m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return dateStr;
      return m[1] + '年' + parseInt(m[2]) + '月' + parseInt(m[3]) + '日';
    }

    // ── エラー表示 ──
    function showError(msg) {
      document.getElementById('main').innerHTML = `
        <div class="error-card">
          <h2>⚠️ 読み取りエラー</h2>
          <p>${msg}</p>
        </div>`;
    }

    // ── レシート形式（明細あり）──
    function buildReceiptHTML(data) {
      const items = data.items || [];

      // 明細行
      let itemRows = '';
      let subtotal = 0;
      for (const item of items) {
        const qty   = item.q || 1;
        const price = item.p || 0;
        subtotal += price;
        itemRows += `
          <tr>
            <td class="item-name">${escHtml(item.n)}</td>
            <td class="item-qty">${qty > 1 ? '×' + qty : ''}</td>
            <td class="item-price">${formatAmount(price)}</td>
          </tr>`;
      }

      const total = data.total || subtotal;

      // インボイス番号（課税事業者のみ）
      const invoiceLine = data.invoice
        ? `<div class="shop-invoice">${escHtml(data.invoice)}</div>` : '';

      return `
        <div class="receipt-card">
          <div class="section">
            <div class="shop-name">${escHtml(data.shop || '')}</div>
            ${invoiceLine}
            <div class="receipt-meta">${formatDate(data.date || '')}</div>
            <div class="receipt-no">No. ${escHtml(data.no || '')}</div>
          </div>

          <div class="section">
            <table class="items-table">
              <tbody>
                ${itemRows}
              </tbody>
              <tfoot>
                <tr class="total-row">
                  <td class="total-label" colspan="2">合　計</td>
                  <td class="item-price">${formatAmount(total)}</td>
                </tr>
              </tfoot>
            </table>
          </div>

          <div class="section">
            <div class="notice">
              <span class="notice-icon">⚠️</span>本レシートはサーバーに記録されておりません。スクリーンショットをお忘れないようお願いいたします。
            </div>
          </div>
        </div>`;
    }

    // ── 領収書形式（明細なし・26件以上）──
    function buildRyoshuchoHTML(data) {
      const atena   = data.atena   || '上様';
      const tadashi = data.tadashi || '商品代として';
      const total   = data.total   || 0;

      const invoiceLine = data.invoice
        ? `<div class="shop-invoice">${escHtml(data.invoice)}</div>` : '';

      return `
        <div class="receipt-card">
          <div class="section">
            <div class="shop-name">${escHtml(data.shop || '')}</div>
            ${invoiceLine}
            <div class="receipt-meta">${formatDate(data.date || '')}</div>
            <div class="receipt-no">No. ${escHtml(data.no || '')}</div>
          </div>

          <div class="section ryoshucho">
            <div class="ryoshucho-title">領 収 書</div>
            <div class="ryoshucho-atena">${escHtml(atena)}</div>
            <div class="ryoshucho-total">${formatAmount(total)}</div>
            <div class="ryoshucho-tadashi">${escHtml(tadashi)}</div>
          </div>

          <div class="section">
            <div class="overflow-notice">
              ⚠️ 品目数が多いため明細を含められません。明細は別途ご確認ください。
            </div>
            <div class="notice">
              <span class="notice-icon">⚠️</span>本レシートはサーバーに記録されておりません。スクリーンショットをお忘れないようお願いいたします。
            </div>
          </div>
        </div>`;
    }

    // ── エスケープ ──
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ── メイン処理 ──
    function main() {
      const hash = location.hash.slice(1); // # を除去

      if (!hash) {
        showError('QRコードのURLが正しくありません。<br>マルセイミニレジから発行されたQRコードをお使いください。');
        return;
      }

      let data;
      try {
        const json = base64urlDecode(hash);
        data = JSON.parse(json);
      } catch (e) {
        showError('データの読み取りに失敗しました。<br>QRコードが破損している可能性があります。');
        return;
      }

      // バージョン確認
      if (data.v !== '1') {
        showError('対応していない形式です（v' + (data.v || '?') + '）。<br>アプリを最新版にアップデートしてください。');
        return;
      }

      // 形式分岐
      let html;
      if (data.overflow === true) {
        html = buildRyoshuchoHTML(data);
      } else {
        html = buildReceiptHTML(data);
      }

      document.getElementById('main').innerHTML = html;
      document.title = (data.shop || 'マルセイミニレジ') + ' 電子レシート';
    }

    // DOM準備後に実行
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main);
    } else {
      main();
    }

  })();
  </script>
</body>
</html>
