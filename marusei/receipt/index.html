<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>マルセイミニレジ 電子レシート</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:    #1a6fba;
      --black:   #111111;
      --gray:    #666666;
      --light:   #999999;
      --border:  #dddddd;
      --bg:      #f5f5f5;
      --card:    #ffffff;
      --warn-bg: #fff8e1;
      --warn-fg: #b45309;
      --err-bg:  #fff0f0;
      --err-fg:  #cc0000;
      --font:    'Noto Sans Mono','Courier New','Osaka-Mono',monospace;
      --w:       360px;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .site-header {
      width: 100%; max-width: var(--w);
      text-align: center; margin-bottom: 20px;
      font-size: 12px; color: var(--light);
    }
    .card {
      width: 100%; max-width: var(--w);
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .sec {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sec:last-child { border-bottom: none; }

    /* ── ショップヘッダー ── */
    .shop-name    { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .shop-invoice { font-size: 11px; color: var(--gray); text-align: center; margin-bottom: 2px; }
    .shop-zip     { font-size: 12px; color: var(--gray); text-align: center; margin-bottom: 1px; }
    .shop-addr    { font-size: 12px; color: var(--gray); text-align: center; margin-bottom: 1px; }
    .shop-tel     { font-size: 12px; color: var(--gray); text-align: center; margin-bottom: 1px; }
    .shop-url     { font-size: 11px; color: var(--blue);  text-align: center; margin-bottom: 1px; }
    .shop-note-top{ font-size: 11px; color: var(--gray); text-align: center; margin-top: 4px; }

    /* ── 日時・ID ── */
    .shop-id  { font-size: 10px; color: var(--light); text-align: left;
                 letter-spacing: 0.05em; margin-bottom: 2px; }
    .rec-meta { font-size: 12px; color: var(--gray); text-align: center; }
    .rec-no   { font-size: 11px; color: var(--light); text-align: center; margin-top: 2px; }
    .rec-pay  { font-size: 12px; color: var(--gray);  text-align: center; margin-top: 2px; }

    /* ── 明細テーブル ── */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl td { padding: 4px 0; font-size: 14px; vertical-align: top; }
    .td-name  { text-align: left; }
    .td-qty   { text-align: center; color: var(--gray); font-size: 12px; width: 36px; }
    .td-price { text-align: right; white-space: nowrap; }
    .sub-row td { font-size: 11px; color: var(--gray); padding: 1px 0; }
    .subtotal-row .td-name { font-size: 11px; color: var(--gray); padding: 3px 0; }
    .subtotal-row .td-price { font-size: 14px; color: var(--black); padding: 3px 0; font-weight: 400; }
    .td-sub   { text-align: left; }
    .td-price.td-sub { text-align: right; }
    .td-price.minus { color: #cc6600; }
    .td-price.sub-minus { color: #cc0000; }
    .tbl tfoot tr.total td {
      font-size: 17px; font-weight: 700;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    /* ── 税区分 ── */
    .tax-row td    { font-size: 11px; color: var(--gray); padding: 2px 0; }
    .tax-indent    { padding-left: 12px !important; }

    /* ── 自由表記（下） ── */
    .note-bottom { font-size: 11px; color: var(--gray); text-align: center; }

    /* ── 領収書 ── */
    .ryoshucho { text-align: center; }
    .ryo-title   { font-size: 16px; font-weight: 700; letter-spacing: 0.3em; margin-bottom: 10px; }
    .ryo-atena   { font-size: 15px; margin-bottom: 6px; }
    .ryo-total   { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .ryo-tadashi { font-size: 13px; color: var(--gray); }

    /* ── 注意文 ── */
    .notice {
      font-size: 11px; color: var(--warn-fg); background: var(--warn-bg);
      padding: 10px 14px; border-radius: 6px; line-height: 1.7;
    }
    .notice + .notice { margin-top: 8px; }

    /* ── エラー ── */
    .error-card {
      width: 100%; max-width: var(--w);
      background: var(--err-bg); border-radius: 12px;
      padding: 24px 20px; text-align: center;
    }
    .error-card h2 { font-size: 16px; color: var(--err-fg); margin-bottom: 8px; }
    .error-card p  { font-size: 13px; color: var(--gray); line-height: 1.6; }
    #loading { font-size: 14px; color: var(--gray); padding: 40px; }

    /* 署名検証 */
    .sig-ok  { font-size:11px; color:#16a34a; background:#f0fdf4; padding:8px 12px; border-radius:6px; margin-bottom:8px; }
    .sig-ng  { font-size:11px; color:#dc2626; background:#fef2f2; padding:8px 12px; border-radius:6px; margin-bottom:8px; }
    .sig-pub { font-size:10px; color:var(--light); word-break:break-all; margin-top:4px; }

    @media (max-width: 400px) {
      .shop-name { font-size: 16px; }
      .tbl tfoot tr.total td { font-size: 15px; }
      .ryo-total { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">マルセイミニレジ</header>
  <main id="main"><div id="loading">読み込み中...</div></main>

  <script>
  (function(){
    'use strict';

    function b64decode(s){
      s=s.replace(/-/g,'+').replace(/_/g,'/');
      while(s.length%4)s+='=';
      const b=atob(s),u=new Uint8Array(b.length);
      for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      return new TextDecoder('utf-8').decode(u);
    }

    function b64toAb(s){
      s=s.replace(/-/g,'+').replace(/_/g,'/');
      while(s.length%4)s+='=';
      const b=atob(s),u=new Uint8Array(b.length);
      for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      return u.buffer;
    }

    function fmt(n){
      return '\u00a5\u00a0'+Math.abs(n).toLocaleString('ja-JP');
    }

    function fmtDate(s){
      const m=(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m?m[1]+'年'+parseInt(m[2])+'月'+parseInt(m[3])+'日':(s||'');
    }

    // Base62デコード（0-9A-Za-z）
    const B62='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
    function b62decode(s){
      let r=0;
      for(const c of s) r=r*62+B62.indexOf(c);
      return r;
    }

    // ID → JST時刻（T+base62(6桁)+seq(2桁)）Asia/Tokyo明示
    function idToTime(id){
      if(!id||id.length<7) return '';
      try{
        const unix=b62decode(id.slice(1,7));
        const d=new Date(unix*1000);
        return d.toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false});
      }catch(e){return '';}
    }

    function esc(s){
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // 公開鍵 → 店舗ID（SHA-256 → Base32 → 先頭10文字 → xxxx-xxxx-xx）
    async function pubkeyToShopId(pubB64url){
      try{
        // Base64url → ArrayBuffer
        let s=pubB64url.replace(/-/g,'+').replace(/_/g,'/');
        while(s.length%4)s+='=';
        const b=atob(s),u=new Uint8Array(b.length);
        for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
        // SHA-256
        const hash=await crypto.subtle.digest('SHA-256',u.buffer);
        // Base32エンコード（RFC 4648・大文字）
        const bytes=new Uint8Array(hash);
        const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        let bits=0,val=0,out='';
        for(const byte of bytes){
          val=(val<<8)|byte; bits+=8;
          while(bits>=5){ out+=alpha[(val>>>(bits-5))&31]; bits-=5; }
        }
        // 先頭10文字を xxxx-xxxx-xx に
        const raw=out.slice(0,10);
        return raw.slice(0,4)+'-'+raw.slice(4,9)+'-'+raw.slice(9,10);
      }catch(e){ return ''; }
    }

    function showError(msg){
      document.getElementById('main').innerHTML=
        `<div class="error-card"><h2>⚠️ 読み取りエラー</h2><p>${msg}</p></div>`;
    }

    // ショップヘッダーHTML生成
    function shopHeader(d){
      let h='';
      // 店舗IDプレースホルダー（公開鍵があれば後から差し込む）
      if(d._pubkey){
        h+=`<div class="shop-id" id="shop-id-placeholder">...</div>`;
      }
      h+=`<div class="shop-name">${esc(d.shop||'')}</div>`;
      if(d.invoice) h+=`<div class="shop-invoice">${esc(d.invoice)}</div>`;
      if(d.zip)     h+=`<div class="shop-zip">\u3012${esc(d.zip)}</div>`;
      if(d.addr){
        for(const a of d.addr){
          if(a) h+=`<div class="shop-addr">${esc(a)}</div>`;
        }
      }
      if(d.tel) h+=`<div class="shop-tel">TEL ${esc(d.tel)}</div>`;
      if(d.url) h+=`<div class="shop-url">${esc(d.url)}</div>`;
      if(d.ntop) h+=`<div class="shop-note-top">${esc(d.ntop)}</div>`;
      return h;
    }

    // レシート形式（明細あり）
    function buildReceipt(d, sigHtmlStr){
      const timeStr=idToTime(d.no);
      const dateTimeStr=fmtDate(d.date)+(timeStr?' '+timeStr:'');
      const paymentLine=d.pay?`<div class="rec-pay">${esc(d.pay)}</div>`:'';
      const items=d.items||[];
      let rows='';
      // 親行にトッピングありフラグを付ける
      for(let ii=0; ii<items.length; ii++){
        const next = items[ii+1];
        items[ii]._hasChild = next && (next.n||'').startsWith('└');
      }
      for(const item of items){
        const qty  = item.q || 1;
        const name = item.n || '';
        const price = item.p || 0;

        if(item.sub){
          // 小計・値引き行（セット売り）
          const isDiscount = price < 0;
          const isSubtotal = name.trim().startsWith('小計');
          rows += `<tr class="${isSubtotal ? 'subtotal-row' : 'sub-row'}">
            <td class="td-name ${isSubtotal?'':'td-sub'}" colspan="2">&nbsp;&nbsp;${esc(name)}</td>
            <td class="td-price ${isSubtotal?'':'td-sub'} ${isDiscount?'minus':''}">${
              isDiscount
                ? '△¥ '+Math.abs(price).toLocaleString('ja-JP')
                : fmt(price)
            }</td>
          </tr>`;
        } else if(name.startsWith('└')){
          // 子行（インデント・価格付き）
          const childName = name.slice(1);
          rows += `<tr class="sub-row">
            <td class="td-name td-sub">&nbsp;&nbsp;└${esc(childName)}${qty>1?'&nbsp;&times;'+qty:''}</td>
            <td class="td-qty"></td>
            <td class="td-price td-sub">${price < 0
              ? '△¥ '+Math.abs(price).toLocaleString('ja-JP')
              : fmt(price)}</td>
          </tr>`;
        } else {
          // 親行（単品またはセット親）
          const hasChild = item._hasChild;
          const priceStr = price < 0
            ? '△¥ '+Math.abs(price).toLocaleString('ja-JP')
            : fmt(price);
          // 単品: 黒太字 / セット親: 薄く小さく
          rows += `<tr>
            <td class="td-name">${esc(name)}</td>
            <td class="td-qty">${qty>1?'&times;'+qty:''}</td>
            <td class="td-price${hasChild?' td-sub':''}">${priceStr}</td>
          </tr>`;
        }
      }

      // 税区分
      let taxRows='';
      if(d.tax&&d.tax.length){
        for(const t of d.tax){
          taxRows+=`<tr class="tax-row">
            <td class="td-name">${esc(t.r)}%対象</td>
            <td class="td-qty"></td>
            <td class="td-price">${fmt(t.t)}</td>
          </tr><tr class="tax-row">
            <td class="td-name tax-indent">消費税</td>
            <td class="td-qty"></td>
            <td class="td-price">${fmt(t.x)}</td>
          </tr>`;
        }
      }
      const taxSec=taxRows
        ?`<div class="sec"><table class="tbl"><tbody>${taxRows}</tbody></table></div>`:'';

      // 内消費税合計（taxRowsがある場合のみ・合計直下に表示）
      let totalTaxAmt=0;
      if(d.tax&&d.tax.length){
        for(const t of d.tax) totalTaxAmt+=t.x;
      }
      const totalTaxRow=totalTaxAmt>0
        ?`<tr><td colspan="2" style="font-size:12px;color:var(--gray);padding-top:4px;">内消費税</td><td class="td-price" style="font-size:12px;color:var(--gray);padding-top:4px;">${fmt(totalTaxAmt)}</td></tr>`
        :'';

      // 自由表記（下）
      const noteBtm=d.nbtm
        ?`<div class="sec"><div class="note-bottom">${esc(d.nbtm)}</div></div>`:'';

      return `<div class="card">
        <div class="sec">${shopHeader(d)}</div>
        <div class="sec">
          <div class="rec-meta">${dateTimeStr}</div>
          <div class="rec-no">No. ${esc(d.no||'')}</div>
          ${paymentLine}
        </div>
        <div class="sec">
          <table class="tbl">
            <tbody>${rows}</tbody>
            <tfoot>
              <tr class="total">
                <td class="td-name" colspan="2">合　計</td>
                <td class="td-price">${fmt(d.total||0)}</td>
              </tr>
              ${totalTaxRow}
            </tfoot>
          </table>
        </div>
        ${taxSec}
        ${noteBtm}
        <div class="sec">
          <div class="notice">⚠️ 本レシートはサーバーに記録されておりません。スクリーンショットをお忘れないようお願いいたします。</div>
        </div>
      </div>`;
    }

    // 領収書形式（明細なし）
    function buildRyoshucho(d, sigHtmlStr){
      const timeStr=idToTime(d.no);
      const dateTimeStr=fmtDate(d.date)+(timeStr?' '+timeStr:'');
      const paymentLine=d.pay?`<div class="rec-pay">${esc(d.pay)}</div>`:'';
      const atena=d.atena||'上様';
      const tadashi=d.tadashi||'商品代として';

      const noteBtm=d.nbtm
        ?`<div class="sec"><div class="note-bottom">${esc(d.nbtm)}</div></div>`:'';

      return `<div class="card">
        <div class="sec">${shopHeader(d)}</div>
        <div class="sec">
          <div class="rec-meta">${dateTimeStr}</div>
          <div class="rec-no">No. ${esc(d.no||'')}</div>
          ${paymentLine}
        </div>
        <div class="sec ryoshucho">
          <div class="ryo-title">領 収 書</div>
          <div class="ryo-atena">${esc(atena)}</div>
          <div class="ryo-total">${fmt(d.total||0)}</div>
          <div class="ryo-tadashi">${esc(tadashi)}</div>
        </div>
        ${noteBtm}
        <div class="sec">
          <div class="notice">⚠️ 品目数が多いため明細を含められません。明細は別途ご確認ください。</div>
          <div class="notice">⚠️ 本レシートはサーバーに記録されておりません。スクリーンショットをお忘れないようお願いいたします。</div>
        </div>
      </div>`;
    }

    // ── Ed25519署名検証（Web Crypto API）──
    // 新フォーマット: outer={p,s,k} 署名対象=outer.pのUTF-8バイト列
    async function verifySig(outer) {
      if (!outer.s || !outer.k || !outer.p) return null;
      try {
        const msgBytes = new TextEncoder().encode(outer.p);
        const pubKey = await crypto.subtle.importKey(
          'raw', b64toAb(outer.k), {name:'Ed25519'}, false, ['verify']
        );
        const ok = await crypto.subtle.verify('Ed25519', pubKey, b64toAb(outer.s), msgBytes);
        return { ok, pub: outer.k };
      } catch(e) {
        return { ok: false, pub: (outer.k||'') };
      }
    }

    function sigHTML(result) {
      if (!result) return '';
      if (result.ok) {
        return `<div class="sig-ok">✅ 署名は一致しました
          <div class="sig-pub">検証用公開鍵: ${esc(result.pub)}</div>
        </div>`;
      } else {
        return `<div class="sig-ng">❌ 署名が一致しません
          <div class="sig-pub">検証用公開鍵: ${esc(result.pub)}</div>
        </div>`;
      }
    }

    async function main(){
      const hash=location.hash.slice(1);
      if(!hash){
        showError('QRコードのURLが正しくありません。<br>マルセイミニレジから発行されたQRコードをお使いください。');
        return;
      }
      let outer, d;
      try{ outer=JSON.parse(b64decode(hash)); }
      catch(e){
        showError('データの読み取りに失敗しました。<br>QRコードが破損している可能性があります。');
        return;
      }

      // フォーマット判定: 新={p,s,k} 旧={v,...}
      const isNew = outer.p && outer.s && outer.k;
      if(isNew){
        try{ d=JSON.parse(b64decode(outer.p)); }
        catch(e){
          showError('ペイロードの読み取りに失敗しました。');
          return;
        }
      } else {
        d = outer;
      }

      if(d.v!=='1'){
        showError('対応していない形式です（v'+esc(d.v||'?')+'）。<br>アプリを最新版にアップデートしてください。');
        return;
      }

      // 表示（即時）
      // 公開鍵をdに付与（shopHeaderで店舗IDプレースホルダー生成に使用）
      if(isNew && outer.k) d._pubkey = outer.k;
      document.getElementById('main').innerHTML=
        d.overflow===true ? buildRyoshucho(d,'') : buildReceipt(d,'');
      document.title=esc(d.shop||'マルセイミニレジ')+' 電子レシート';

      // 署名検証（非同期・完了後に差し込む）
      const sigResult = isNew ? await verifySig(outer) : null;
      if(sigResult !== null) {
        const noticeEls = document.querySelectorAll('.sec:last-child');
        if(noticeEls.length > 0) {
          const last = noticeEls[noticeEls.length-1];
          last.insertAdjacentHTML('afterbegin', sigHTML(sigResult));
        }
        // 店舗IDを差し込む
        const shopIdEl = document.getElementById('shop-id-placeholder');
        if(shopIdEl && outer.k){
          const shopId = await pubkeyToShopId(outer.k);
          if(shopId) shopIdEl.textContent = '店舗ID: '+shopId;
          else shopIdEl.remove();
        }
      }
    }

    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',main);
    } else { main(); }
  })();
  </script>
</body>
</html>
